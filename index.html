<script>
(function(){
  var deferredPrompt = null;
  var banner = document.getElementById('pwa-install-banner');

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    if (banner) banner.style.display = 'flex';
  });

  document.getElementById('pwa-install-btn').addEventListener('click', function() {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function() {
      deferredPrompt = null;
      if (banner) banner.style.display = 'none';
    });
  });

  document.getElementById('pwa-dismiss-btn').addEventListener('click', function() {
    if (banner) banner.style.display = 'none';
  });

  // Hide banner if already installed
  if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true) {
    if (banner) banner.style.display = 'none';
  }
})();
</script>

<!-- ══ FLYING STARS ENGINE ══════════════════════════════════════════ -->
<script>
(function(){
  var canvas, ctx, stars=[], raf, heroEl;
  var W=0, H=0;

  /* ── Star shapes ─────────────────────────────────── */
  function drawStar(cx,cy,r,pts,inner,rot){
    ctx.beginPath();
    for(var i=0;i<pts*2;i++){
      var angle=rot + i*Math.PI/pts;
      var radius=(i%2===0)?r:inner;
      ctx.lineTo(cx+Math.cos(angle)*radius, cy+Math.sin(angle)*radius);
    }
    ctx.closePath();
  }
  function drawSparkle(cx,cy,r){
    // 4-point diamond sparkle
    ctx.beginPath();
    ctx.moveTo(cx, cy-r);
    ctx.quadraticCurveTo(cx+r*0.15, cy-r*0.15, cx+r, cy);
    ctx.quadraticCurveTo(cx+r*0.15, cy+r*0.15, cx, cy+r);
    ctx.quadraticCurveTo(cx-r*0.15, cy+r*0.15, cx-r, cy);
    ctx.quadraticCurveTo(cx-r*0.15, cy-r*0.15, cx, cy-r);
    ctx.closePath();
  }

  /* ── Create a star particle ──────────────────────── */
  function makeStar(){
    var type=Math.random()<0.5?'star':(Math.random()<0.5?'sparkle':'dot');
    var size=type==='dot'?(1+Math.random()*2):(3+Math.random()*7);
    // start anywhere in hero, drift up and sideways
    return{
      x: Math.random()*W,
      y: H + size + Math.random()*40,   // start just below hero bottom
      vx: (Math.random()-0.5)*0.6,
      vy: -(0.4 + Math.random()*1.0),   // float upward
      size: size,
      type: type,
      rot: Math.random()*Math.PI*2,
      spin: (Math.random()-0.5)*0.03,
      alpha: 0,
      targetAlpha: 0.55 + Math.random()*0.45,
      life: 0,
      maxLife: 200 + Math.random()*300,
      // colour: white, gold, or orange-amber
      hue: Math.random()<0.5?'#ffffff':(Math.random()<0.5?'#ffd54f':'#ffab40'),
      // trail
      trail:[],
    };
  }

  /* ── Resize handler ──────────────────────────────── */
  function resize(){
    if(!heroEl)return;
    var rect=heroEl.getBoundingClientRect();
    W=rect.width; H=rect.height;
    canvas.width=W*window.devicePixelRatio;
    canvas.height=H*window.devicePixelRatio;
    canvas.style.width=W+'px';
    canvas.style.height=H+'px';
    ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  }

  /* ── Draw glow helper ────────────────────────────── */
  function glow(r,color){
    ctx.shadowBlur=r;
    ctx.shadowColor=color;
  }

  /* ── Animation loop ──────────────────────────────── */
  function tick(){
    raf=requestAnimationFrame(tick);
    if(!heroEl || !heroEl.isConnected){ stop(); return; }

    ctx.clearRect(0,0,W,H);

    // Spawn stars up to 38 particles
    if(stars.length<38 && Math.random()<0.18) stars.push(makeStar());

    stars=stars.filter(function(s){ return s.life<s.maxLife && s.y>-s.size*4; });

    stars.forEach(function(s){
      s.life++;
      s.x+=s.vx;
      s.y+=s.vy;
      s.rot+=s.spin;

      // fade in/out
      var progress=s.life/s.maxLife;
      if(progress<0.15) s.alpha=s.targetAlpha*(progress/0.15);
      else if(progress>0.75) s.alpha=s.targetAlpha*((1-progress)/0.25);
      else s.alpha=s.targetAlpha;

      // gentle horizontal sway
      s.x+=Math.sin(s.life*0.04)*0.25;

      ctx.save();
      ctx.globalAlpha=s.alpha;

      if(s.type==='dot'){
        glow(8,s.hue);
        ctx.fillStyle=s.hue;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
        // inner bright core
        ctx.shadowBlur=3;
        ctx.fillStyle='#ffffff';
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size*0.4,0,Math.PI*2);
        ctx.fill();
      } else if(s.type==='sparkle'){
        glow(14,s.hue);
        ctx.fillStyle=s.hue;
        drawSparkle(s.x,s.y,s.size);
        ctx.fill();
        ctx.shadowBlur=5;
        ctx.fillStyle='#ffffff';
        drawSparkle(s.x,s.y,s.size*0.4);
        ctx.fill();
      } else {
        // 5-point star
        glow(12,s.hue);
        ctx.fillStyle=s.hue;
        drawStar(s.x,s.y,s.size,5,s.size*0.42,s.rot);
        ctx.fill();
        // bright core
        ctx.shadowBlur=4;
        ctx.fillStyle='#ffffff';
        drawStar(s.x,s.y,s.size*0.38,5,s.size*0.18,s.rot);
        ctx.fill();
      }

      ctx.restore();
    });
  }

  function stop(){
    if(raf) cancelAnimationFrame(raf);
    raf=null;
  }

  /* ── Mount canvas into hero whenever hero exists ─── */
  function mount(){
    heroEl=document.querySelector('.rc-hero');
    if(!heroEl){
      // hero not in DOM yet; keep watching
      setTimeout(mount,200);
      return;
    }
    // Check if canvas already mounted
    if(heroEl.querySelector('#rc-star-canvas')){
      // Re-check hero still in DOM
      if(!raf) tick();
      return;
    }
    canvas=document.createElement('canvas');
    canvas.id='rc-star-canvas';
    heroEl.insertBefore(canvas,heroEl.firstChild);
    ctx=canvas.getContext('2d');
    resize();
    window.addEventListener('resize',function(){
      // re-find hero (it may have re-rendered)
      heroEl=document.querySelector('.rc-hero');
      if(heroEl&&canvas&&heroEl.contains(canvas)) resize();
    });
    if(raf) cancelAnimationFrame(raf);
    tick();
  }

  /* ── Re-mount after every render (hero re-created in DOM) ── */
  // Use MutationObserver to watch for hero re-creation
  var appEl=document.getElementById('rc-app');
  if(appEl){
    var obs=new MutationObserver(function(){
      heroEl=document.querySelector('.rc-hero');
      if(heroEl && !heroEl.querySelector('#rc-star-canvas')){
        stop();
        stars=[];
        mount();
      }
    });
    obs.observe(appEl,{childList:true,subtree:true});
  }
  // Initial mount after a brief delay
  setTimeout(mount,300);
})();
</script>
</body>
</html>
